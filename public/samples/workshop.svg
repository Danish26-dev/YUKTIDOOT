<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Illustration of a small machining workshop">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9d3c4"/><stop offset="1" stop-color="#c7bfab"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a8172"/><stop offset="1" stop-color="#6d6557"/></linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff7da" stop-opacity=".9"/><stop offset="1" stop-color="#fff7da" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#wall)"/>
  <rect y="360" width="800" height="140" fill="url(#floor)"/>
  <rect x="540" y="40" width="200" height="150" rx="4" fill="#b9d0e6" stroke="#5b5447" stroke-width="8"/>
  <line x1="640" y1="40" x2="640" y2="190" stroke="#5b5447" stroke-width="6"/>
  <line x1="540" y1="115" x2="740" y2="115" stroke="#5b5447" stroke-width="6"/>
  <polygon points="540,190 740,190 800,420 470,420" fill="url(#light)" opacity=".45"/>
  <!-- racks with stock -->
  <rect x="40" y="70" width="230" height="10" fill="#4b463c"/>
  <rect x="40" y="160" width="230" height="10" fill="#4b463c"/>
  <rect x="40" y="250" width="230" height="10" fill="#4b463c"/>
  <rect x="44" y="70" width="10" height="290" fill="#3b372f"/>
  <rect x="256" y="70" width="10" height="290" fill="#3b372f"/>
  <g fill="#9aa1a8" stroke="#6b7177" stroke-width="2">
    <rect x="62" y="132" width="180" height="10" rx="5"/><rect x="62" y="144" width="180" height="10" rx="5"/><rect x="70" y="120" width="170" height="10" rx="5"/>
    <rect x="62" y="222" width="190" height="9" rx="4"/><rect x="62" y="234" width="190" height="9" rx="4"/><rect x="66" y="210" width="160" height="9" rx="4"/>
  </g>
  <g fill="#a46c2c"><rect x="70" y="88" width="46" height="64" rx="3"/><rect x="124" y="98" width="40" height="54" rx="3"/><rect x="172" y="92" width="52" height="60" rx="3"/></g>
  <g fill="#1546D9"><rect x="66" y="300" width="56" height="58" rx="4"/></g><g fill="#F9B318"><rect x="132" y="310" width="48" height="48" rx="4"/></g>
  <!-- lathe -->
  <rect x="300" y="300" width="330" height="22" rx="4" fill="#3d4a5c"/>
  <rect x="320" y="322" width="40" height="70" fill="#2e3846"/><rect x="570" y="322" width="40" height="70" fill="#2e3846"/>
  <rect x="300" y="390" width="330" height="14" rx="3" fill="#232a35"/>
  <rect x="310" y="220" width="110" height="82" rx="8" fill="#4f6f8f"/>
  <circle cx="430" cy="262" r="26" fill="#9aa1a8" stroke="#2e3846" stroke-width="5"/>
  <rect x="452" y="256" width="110" height="12" rx="6" fill="#c9ccd0"/>
  <rect x="560" y="240" width="56" height="62" rx="6" fill="#4f6f8f"/>
  <rect x="490" y="272" width="40" height="28" rx="3" fill="#2e3846"/>
  <circle cx="345" cy="245" r="7" fill="#F9B318"/><circle cx="370" cy="245" r="7" fill="#c2362b"/>
  <!-- workbench -->
  <rect x="660" y="300" width="130" height="14" fill="#7a5530"/>
  <rect x="668" y="314" width="10" height="80" fill="#5d3f22"/><rect x="772" y="314" width="10" height="80" fill="#5d3f22"/>
  <g fill="#c9ccd0" stroke="#7d8389" stroke-width="2"><rect x="676" y="282" width="34" height="18" rx="3"/><circle cx="738" cy="292" r="9"/><circle cx="760" cy="292" r="9"/></g>
  <!-- finished parts bin -->
  <rect x="120" y="398" width="120" height="58" rx="6" fill="#1546D9"/>
  <g fill="#d8dbe0" stroke="#7d8389" stroke-width="2"><rect x="134" y="386" width="40" height="12" rx="6"/><rect x="178" y="384" width="46" height="12" rx="6"/></g>
  <text x="400" y="480" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#efe9dc" opacity=".85">Sample workshop photo (illustration)</text>
</svg>
